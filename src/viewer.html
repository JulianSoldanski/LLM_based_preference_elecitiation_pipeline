<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline</title>
<style>
  :root {
    --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --soft: #f5f5f7; --accent: #0a66c2;
    --ok: #1a7f37; --ok-bg: #e8f5ec; --bad: #b42318; --bad-bg: #fdecea; --edit: #8a5a00; --edit-bg: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c30; --soft: #1f1f22; --accent: #5aa9ff;
      --ok: #5cc87a; --ok-bg: #173222; --bad: #ff7b72; --bad-bg: #3a1a1a; --edit: #f0b44c; --edit-bg: #33280f;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .bad-text { color: var(--bad); }

  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  input, select, button, textarea { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { cursor: pointer; }
  #model { width: 220px; }
  #runs, #pause { width: 64px; }
  button.primaer { background: var(--accent); border-color: var(--accent); color: #fff; padding: 6px 18px; }
  button.aktiv { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  textarea { width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; }

  .schritte { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 20px; font-size: 13px; }
  .schritt { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .schritt.aktiv { border-color: var(--accent); color: var(--accent); }
  .schritt.fertig { color: var(--fg); }

  .statuszeile { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .laeufe button, .faelle button { padding: 2px 10px; font-size: 13px; }

  .fokus { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; min-height: 48px; }
  .fokus.laeuft { border-color: var(--accent); }
  .fokus .kopf { font-weight: 600; margin-bottom: 4px; }
  .zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  code { font: 12px ui-monospace, monospace; background: var(--soft); padding: 2px 6px; border-radius: 4px; word-break: break-all; }

  .spalten { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .spalte { background: var(--soft); border-radius: 8px; padding: 10px; min-height: 120px; border: 2px solid transparent; }
  .spalte.ziel { border-color: var(--accent); }
  .spalte h2 { font-size: 13px; margin: 0 0 8px; }
  .spalte h2 span { font-weight: 400; color: var(--muted); }
  .spalte h2 .leer { color: var(--bad); font-weight: 600; }
  .spalte.jetzt { border-color: var(--accent); }
  .spalte ul { margin: 0 0 10px; padding-left: 18px; font-size: 12px; }
  .spalte table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .spalte td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .schritt[data-ansicht] { cursor: pointer; }
  .chip { display: block; box-sizing: border-box; cursor: pointer; margin-bottom: 6px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 12px; }
  .chip[draggable="true"] { cursor: grab; }
  .chip b { font-size: 13px; }
  .chip.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .chip.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
  .chip.offen { border-style: dashed; }
  .chip.verschoben { background: var(--edit-bg); border-color: transparent; color: var(--edit); }
  .chip.geloescht { opacity: .6; text-decoration: line-through; }
  .chip.gewaehlt { outline: 2px solid var(--accent); }
  .chip.jetzt { border-color: var(--accent); animation: puls 1s ease-in-out infinite; }
  .chip.neu { animation: rein .5s ease-out; }
  @keyframes puls { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); } }
  @keyframes rein { from { opacity: 0; transform: translateY(-6px); } }

  .detail, .entscheidung { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
  .detail p { margin: 0 0 10px; white-space: pre-wrap; }

  /* Gate 1: Passage oben, Entscheidung als Leiste am unteren Rand */
  .detail .zitat { margin: 8px 0 14px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 6px 6px 0; font-size: 15px; white-space: pre-wrap; }
  .urteile { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .urteil { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .urteil .titel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .urteil .wert { font-weight: 600; font-size: 15px; margin: 2px 0 4px; }
  .urteil .grund { color: var(--muted); font-size: 13px; }
  .aktionen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .aktionen .trenner { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .mein { margin-top: 12px; padding: 8px 12px; border-radius: 6px; background: var(--edit-bg); color: var(--edit); }
  .mein button { margin-left: 8px; padding: 2px 8px; font-size: 12px; }
  .entscheidung.leiste { position: sticky; bottom: 0; z-index: 5; background: var(--bg); box-shadow: 0 -6px 16px rgba(0, 0, 0, .18); }

  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; width: min(640px, calc(100vw - 32px)); box-sizing: border-box; background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog form { display: block; margin: 0; }
  dialog h3 { margin: 0 0 4px; font-size: 16px; }
  dialog p { margin: 0 0 12px; }
  dialog .zitat { margin: 4px 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 6px 6px 0; font-size: 14px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  dialog .zitat:empty { display: none; }
  dialog textarea { min-height: 84px; }
  dialog .knoepfe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .legende { font-size: 12px; margin-top: 8px; }

  /* Teil B: Lieferantendaten */
  .spalten.lf { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .spalte[data-lsup] { cursor: pointer; }
  .abschnitt { font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
  .lzeile { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 4px; }
  .strip { display: flex; flex-wrap: wrap; gap: 2px; }
  .q { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  .q.ok { background: var(--ok); }
  .q.bad { background: var(--bad); }
  .q.teil { background: var(--edit); }
  .tabelle { overflow: auto; max-height: 440px; margin-top: 8px; }
  table.daten { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.daten th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.daten td { padding: 3px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  table.daten td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.daten td.bad { color: var(--bad); font-weight: 600; }
  table.daten td.teil { color: var(--edit); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Pipeline</h1>

  <form id="form">
    <select id="provider"><option>openai</option><option>anthropic</option><option>mistral</option></select>
    <input id="model" value="gpt-4o-2024-08-06" placeholder="Modell-ID" required>
    <label class="muted">Produkt <select id="fall"></select></label>
    <label class="muted">Passagen <select id="passagen"></select></label>
    <label class="muted">Pause <input id="pause" type="number" min="0" step="0.5" value="0.5"> s</label>
    <button class="primaer" id="start">Aussagen suchen</button>
    <span id="fehler" class="bad-text"></span>
  </form>

  <div class="schritte" id="schritte"></div>
  <div class="statuszeile"><span id="statustext" class="muted"></span><span class="laeufe" id="laeufe"></span></div>
  <div class="fokus" id="fokus"></div>
  <div class="spalten" id="spalten"></div>
  <p class="legende muted" id="legende"></p>
  <div id="detail"></div>
  <div id="entscheidung"></div>
</main>
<dialog id="dialog">
  <form method="dialog">
    <h3 id="dialogtitel"></h3>
    <div id="dialogzitat" class="zitat"></div>
    <p id="dialogtext" class="muted"></p>
    <textarea id="dialoggrund"></textarea>
    <div class="knoepfe"><button value="abbrechen" formnovalidate>Abbrechen</button><button class="primaer" value="ok" id="dialogok">OK</button></div>
  </form>
</dialog>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const speicher = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                     set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  let basis, st = { running: false, records: [] };
  let angezeigt = null;      // null = dem laufenden Durchlauf folgen
  let gewaehlt = null;       // angeklickte Karte (passage_id)
  let gesehen = new Set();   // schon gezeichnete Karten, für die Einblend-Animation
  let timer = null;
  let fall = null;           // in Gate 1 geöffneter Fall
  let entwurf = {};          // Gate 1: { fall: { passage_id: {action, new_criterion, reason, timestamp} } }
  let formGeaendert = false; // Produkt/Datei von Hand geändert: dann nicht mehr der Suche folgen
  let ansicht = null;        // "zuordnung", "paarvergleich" oder "gate2"; null = automatisch
  let fall2 = null;          // in Gate 2 gewählter Fall
  let entwurf2 = {};         // Gate 2: { fall: { "a|b": {action, preference, intensity, reason} } } je Zyklus
  let partb = null;          // Teil B: Rohdaten der Lieferanten (einmal geladen)
  let lfFall = null, lfWahl = null, lfTab = "orders";

  async function api(pfad, body) {
    const antwort = await fetch(pfad, body ? { method: "POST", body: JSON.stringify(body) } : undefined);
    const daten = await antwort.json();
    if (!antwort.ok) throw new Error(daten.error || antwort.statusText);
    return daten;
  }
  function fehler(e) { $("#fehler").textContent = e ? e.message ?? e : ""; }

  // Passagendatei: vor dem Start die im Formular gewählte, danach die des Laufs.
  const laufDaten = () => st.running || st.result || st.error;
  // Schritt 1: die Suche gehört zum Formular, solange Produkt und Datei dazu passen.
  const suche = () => st.search ?? null;
  const sucheAktuell = () => !!suche() && (suche().running
    || (suche().case === $("#fall").value && suche().passages_file === $("#passagen").value));
  const aktuelleDatei = () => (laufDaten() ? st.passages_file : sucheAktuell() ? suche().passages_file : $("#passagen").value);
  const passagen = () => basis.passages[aktuelleDatei()] ?? basis.passages[basis.default_passages] ?? [];
  const produktName = (id) => (basis.cases.find((c) => c.id === id)?.title ?? id).replace(/^Fall \d+: /, "");
  // Was "Aussagen suchen" gefunden hat (für die Zuordnung dieses Laufs).
  const gefunden = () => (suche()?.records ?? []).filter((r) => r.relevant === true).map((r) => passage(r.passage_id)).filter(Boolean);
  // Erwartung je Passage im Fall des Laufs: Passagen anderer Produkte sind für ihn keine Evidenz.
  const erwartetFuer = (p, fallId) => (p.expected_criteria == null ? null : p.doc_id === fallId ? p.expected_criteria : []);
  const passage = (pid) => passagen().find((p) => p.passage_id === pid);
  const herkunft = (p) => (p.case ? `${p.case.replace(/^Fall \d+: /, "")} · ${p.statement}` : "");
  // relevant === false: vom Relevanzfilter aussortiert, nicht zugeordnet und nicht in Gate 1.
  const aussortiert = (r) => r.relevant === false;
  const ergebnis = (r) => (aussortiert(r) ? "nicht relevant" : r.status !== "ok" ? "failed" : r.criteria.join(", ") || "none");
  const codes = () => basis.criteria.map((c) => c.id);
  // Die Pipeline bearbeitet einen Fall: vor dem Start der im Formular gewählte,
  // danach der des Laufs (null bei älteren Läufen über alle Fälle).
  const aktiverFall = () => (laufDaten() ? st.case : $("#fall").value);
  const fallPassagen = () => passagen().filter((p) => !aktiverFall() || p.doc_id === aktiverFall());
  // Zuordnung: mit Suche genau die gefundenen Aussagen, sonst (ältere Läufe) die des Falls.
  const zuordnungsPassagen = () => (suche()?.result && laufDaten() && suche().case === st.case ? gefunden() : fallPassagen());

  // ---------------------------------------------------------------- Gate 1

  const gateModus = () => !st.running && !!st.result && !st.error;
  const gateRun = () => st.gate1?.run ?? angezeigt ?? st.run ?? 1;
  const faelle = () => [...new Set(passagen().map((p) => p.doc_id))]
    .filter((d) => st.records.some((r) => r.run === gateRun() && r.doc_id === d));
  const fallFertig = (d) => st.gate1?.cases?.[d];
  const recordsVon = (d) => st.records.filter((r) => r.run === gateRun() && r.doc_id === d && !aussortiert(r))
    .sort((a, b) => a.position - b.position);
  // Wie gate1.assignments_from_records: failed kommt als "none" ins Gate
  const agent = (r) => (r.status === "ok" ? r.criteria[0] ?? "none" : "none");

  function zustand(d, r) {
    const fertig = fallFertig(d)?.passages?.[r.passage_id];
    if (fertig) return { action: fertig.action, ziel: fertig.action === "delete" ? "geloescht" : fertig.criterion ?? agent(r), reason: fertig.reason };
    const e = entwurf[d]?.[r.passage_id];
    if (!e) return { action: null, ziel: agent(r), reason: "" };
    return { ...e, ziel: e.action === "delete" ? "geloescht" : e.action === "reassign" ? e.new_criterion : agent(r) };
  }

  function setzen(pid, action, new_criterion = null, reason = null) {
    if (!fall || fallFertig(fall)) return;
    const r = recordsVon(fall).find((x) => x.passage_id === pid);
    if (action === "reassign" && new_criterion === agent(r)) action = "confirm";
    const alt = entwurf[fall]?.[pid] ?? {};
    (entwurf[fall] ??= {})[pid] = { action, new_criterion: action === "reassign" ? new_criterion : null,
      reason: reason ?? alt.reason ?? "", timestamp: new Date().toISOString() };
    zeichnen();
  }

  // Eigener Dialog statt prompt(): Titel, Hinweis, ein Textfeld. Ergebnis ist der
  // Text oder null bei Abbrechen/Esc. Mit pflicht bleibt OK ohne Text gesperrt.
  function fragen({ titel, zitat = "", text = "", wert = "", pflicht = false, platzhalter = "", ok = "OK" }) {
    const dialog = $("#dialog"), feld = $("#dialoggrund"), knopf = $("#dialogok");
    $("#dialogtitel").textContent = titel;
    $("#dialogzitat").textContent = zitat;
    $("#dialogtext").textContent = text;
    feld.value = wert; feld.placeholder = platzhalter; knopf.textContent = ok;
    const pruefen = () => { knopf.disabled = pflicht && !feld.value.trim(); };
    feld.oninput = pruefen; pruefen();
    feld.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !knopf.disabled) dialog.close("ok"); };
    dialog.returnValue = "";
    dialog.showModal();
    feld.focus();
    return new Promise((fertig) => {
      dialog.onclose = () => fertig(dialog.returnValue === "ok" ? feld.value.trim() : null);
    });
  }

  // Löschen und Neu zuordnen nur mit Begründung: erst fragen, dann setzen.
  async function handeln(pid, action, ziel = null) {
    if (!fall || fallFertig(fall)) return;
    const r = recordsVon(fall).find((x) => x.passage_id === pid);
    if (!r) return;
    if (action === "confirm" || (action === "reassign" && ziel === agent(r))) return setzen(pid, "confirm");
    const alt = entwurf[fall]?.[pid];
    const gleich = alt?.action === action && (action === "delete" || alt.new_criterion === ziel);
    const grund = await fragen({
      titel: action === "delete" ? `${pid} löschen` : `${pid}: ${agent(r)} → ${ziel}`,
      zitat: r.text,
      text: action === "delete" ? "Warum fällt die Passage raus?" : `Warum ${ziel} statt ${agent(r)}?`,
      wert: gleich ? alt.reason : "", pflicht: true, platzhalter: "Begründung (Pflicht)",
      ok: action === "delete" ? "Löschen" : "Neu zuordnen",
    });
    if (grund !== null) setzen(pid, action, ziel, grund);
  }

  function pruefen(d) {
    const rs = recordsVon(d);
    const zust = rs.map((r) => [r, zustand(d, r)]);
    const offen = zust.filter(([, z]) => !z.action).map(([r]) => r.passage_id);
    const ohneGrund = zust.filter(([, z]) => (z.action === "delete" || z.action === "reassign") && !z.reason.trim()).map(([r]) => r.passage_id);
    const belegt = new Set(zust.map(([, z]) => z.ziel));
    const ohneEvidenz = codes().filter((c) => !belegt.has(c));
    return { offen, ohneGrund, ohneEvidenz, anzahl: rs.length };
  }

  async function oeffnen(d) {
    try {
      st = await api("/api/gate1/open", { run: gateRun(), case_id: d });
      fall = d; gewaehlt = null; fehler();
    } catch (e) { fehler(e); }
    zeichnen();
  }

  async function abschliessen(decision) {
    const reviewer = $("#reviewer").value.trim();
    if (!reviewer) return fehler("Bitte zuerst ein Kürzel als Prüfer eintragen.");
    speicher.set("reviewer", reviewer);
    // Die Begründung zur Fallentscheidung ist optional und wird erst hier erfragt.
    const grund = await fragen({ titel: `Fall ${fall} mit „${decision}“ abschließen?`,
      text: "Danach ist nichts mehr änderbar.", platzhalter: "Begründung zur Entscheidung (optional)", ok: decision });
    if (grund === null) return;
    const actions = Object.entries(entwurf[fall] ?? {}).filter(([, e]) => e.action).map(([passage_id, e]) => ({ passage_id, ...e }));
    try {
      st = await api("/api/gate1/close", { run: gateRun(), case_id: fall, reviewer, decision,
        decision_reason: grund, actions });
      fehler();
      const naechster = faelle().find((d) => !fallFertig(d));
      gewaehlt = null;
      if (naechster) return oeffnen(naechster);
    } catch (e) { fehler(e); }
    zeichnen();
  }

  // ---------------------------------------------------------------- Zeichnen

  function karte(pid, code, klasse, ziehbar = false, zusatz = "") {
    const key = `${gateModus() ? "g" : angezeigt ?? st.run}|${pid}|${code}`;
    const neu = !gesehen.has(key) && code !== "offen";
    gesehen.add(key);
    const p = passage(pid);
    return `<div class="chip ${klasse} ${neu ? "neu" : ""} ${gewaehlt === pid ? "gewaehlt" : ""}" data-pid="${esc(pid)}" draggable="${ziehbar}">
      <b>${esc(pid)}</b>${zusatz} <span class="muted">Pos. ${p.position}</span><br><span>${esc(herkunft(p))}</span></div>`;
  }

  function spaltenLauf() {
    const run = angezeigt ?? st.run ?? 1;
    const fertig = new Map(st.records.filter((r) => r.run === run).map((r) => [r.passage_id, r]));
    const spalten = [{ code: "offen", titel: "Offen", karten: [] }]
      .concat(basis.criteria.map((c) => ({ code: c.id, titel: `${c.id} <span>${esc(c.name)}</span>`, karten: [] })))
      .concat([{ code: "none", titel: "none <span>kein Kriterium</span>", karten: [] }]);
    const irrelevant = { code: "irrelevant", titel: "Nicht relevant <span>Filter, nicht in Gate 1</span>", karten: [] };
    const failed = { code: "failed", titel: "Failed", karten: [] };
    for (const p of zuordnungsPassagen()) {
      const r = fertig.get(p.passage_id), erwartet = erwartetFuer(p, st.case ?? p.doc_id);
      if (!r) {
        spalten[0].karten.push(karte(p.passage_id, "offen", st.current === p.passage_id && run === st.run ? "jetzt" : ""));
      } else if (aussortiert(r)) {
        irrelevant.karten.push(karte(p.passage_id, "irrelevant", erwartet == null ? "" : erwartet.length ? "bad" : "ok"));
      } else if (r.status !== "ok") {
        failed.karten.push(karte(p.passage_id, "failed", "bad"));
      } else {
        const code = r.criteria[0] ?? "none";
        const klasse = erwartet == null ? "" : (code === "none" ? !erwartet.length : erwartet.includes(code)) ? "ok" : "bad";
        spalten.find((s) => s.code === code).karten.push(karte(p.passage_id, code, klasse));
      }
    }
    if (st.records.some((r) => r.relevant != null) || irrelevant.karten.length) spalten.push(irrelevant);
    if (failed.karten.length) spalten.push(failed);
    return spalten;
  }

  function spaltenGate() {
    const spalten = basis.criteria.map((c) => ({ code: c.id, titel: `${c.id} <span>${esc(c.name)}</span>`, karten: [], pruefen: true }))
      .concat([{ code: "none", titel: "none <span>kein Kriterium</span>", karten: [] },
               { code: "geloescht", titel: "Gelöscht", karten: [] }]);
    if (!fall) return [];
    const offen = !fallFertig(fall);
    for (const r of recordsVon(fall)) {
      const z = zustand(fall, r);
      const klasse = !z.action ? "offen" : z.action === "delete" ? "geloescht" : z.action === "reassign" ? "verschoben" : "";
      const zusatz = z.action === "confirm" ? " ✓" : z.action === "reassign" ? ` <span>von ${esc(agent(r))}</span>` : "";
      spalten.find((s) => s.code === z.ziel).karten.push(karte(r.passage_id, z.ziel, klasse, offen, zusatz));
    }
    return spalten;
  }

  // ---------------------------------------------------- Schritt 1: Aussagen suchen

  function spaltenSuche() {
    const s = sucheAktuell() ? suche() : null, fallId = s?.case ?? $("#fall").value;
    const fertig = new Map((s?.records ?? []).map((r) => [r.passage_id, r]));
    const offen = { code: "offen", titel: "Offen", karten: [] };
    const treffer = { code: "gefunden", titel: `Gefunden <span>Aussagen zu ${esc(produktName(fallId))}</span>`, karten: [] };
    const nicht = { code: "nicht", titel: "Nicht relevant <span>bleibt draußen</span>", karten: [] };
    const failed = { code: "failed", titel: "Failed", karten: [] };
    for (const p of passagen()) {
      const r = fertig.get(p.passage_id), soll = erwartetFuer(p, fallId);
      const zusatz = p.doc_id !== fallId ? ` <span class="muted">· ${esc(produktName(p.doc_id))}</span>` : "";
      if (!r) offen.karten.push(karte(p.passage_id, "offen", s?.current === p.passage_id ? "jetzt" : "", false, zusatz));
      else if (r.status !== "ok") failed.karten.push(karte(p.passage_id, "failed", "bad", false, zusatz));
      else {
        const klasse = soll == null ? "" : (r.relevant === (soll.length > 0)) ? "ok" : "bad";
        (r.relevant ? treffer : nicht).karten.push(karte(p.passage_id, r.relevant ? "gefunden" : "nicht", klasse, false, zusatz));
      }
    }
    return [offen, treffer, nicht, failed].filter((sp) => sp.karten.length || sp.code === "gefunden" || (sp.code === "offen" && !s?.result));
  }

  function zeichnenSuche() {
    const s = sucheAktuell() ? suche() : null, fallId = s?.case ?? $("#fall").value, n = passagen().length;
    const geprueft = s?.records.length ?? 0, sum = s?.summary, ev = s?.evaluation;
    let text = "Bereit. Produkt und Passagendatei wählen, dann „Aussagen suchen“.";
    if (s?.running) text = `Aussagen suchen · ${geprueft} von ${n} Passagen geprüft · ${esc(s.provider)} ${esc(s.model)}`;
    else if (s?.error) text = `<span class="bad-text">Suche abgebrochen: ${esc(s.error)}</span>`;
    else if (s?.result) text = `Suche fertig · ${esc(s.result)}`;
    $("#statustext").innerHTML = text;
    $("#laeufe").innerHTML = "";

    const fokus = $("#fokus");
    fokus.classList.toggle("laeuft", !!s?.current);
    if (s?.current) {
      const p = passage(s.current);
      fokus.innerHTML = `<div class="kopf">Wird geprüft: ${esc(p.passage_id)} <span class="muted">${esc(produktName(p.doc_id))} · Position ${p.position}</span></div>${esc(p.text)}`;
    } else if (s?.result) {
      const zuordnung = st.running || st.result;
      fokus.innerHTML = `<div class="kopf">${sum.found} von ${sum.total} Passagen sind Aussagen zu ${esc(produktName(fallId))}</div>
        <span class="muted">${sum.not_relevant} nicht relevant${sum.failed ? ` · ${sum.failed} failed` : ""}${ev
          ? ` · gegen Ground Truth: Recall ${zahl(ev.recall, 2)}, Precision ${zahl(ev.precision, 2)}${ev.missed.length ? `, übersehen: ${esc(ev.missed.join(", "))}` : ""}` : ""}</span>
        <div class="zeile">${zuordnung
          ? `<span class="muted">Zuordnung ${st.running ? "läuft" : "ist fertig"}.</span><button data-ansicht-ziel="zuordnung">Zur Zuordnung</button>`
          : `<b>Schritt 2: Zuordnen</b><span class="muted">nur die ${sum.found} gefundenen Aussagen · Anbieter, Modell und Pause wie oben</span>
             <label class="muted">Läufe <input id="runs" type="number" min="1" value="1" style="width:64px"></label>
             <button class="primaer" id="zuordnen" ${sum.found ? "" : "disabled"}>Zuordnen</button>`}</div>`;
    } else {
      fokus.innerHTML = `<div class="kopf">Schritt 1: Aussagen suchen</div><span class="muted">Durchsucht werden alle ${n} Passagen aus ${esc(aktuelleDatei())}, über alle Produkte hinweg, nach bewertenden Aussagen zu <b>${esc(produktName(fallId))}</b>. Was nicht gefunden wird, wird nicht zugeordnet.</span>`;
    }

    $("#spalten").innerHTML = spaltenSuche().map((sp) =>
      `<div class="spalte" data-code="${sp.code}"><h2>${sp.titel} <span>${sp.karten.length || ""}</span></h2>${sp.karten.join("")}</div>`).join("");
    $("#legende").textContent = "Grün: wie erwartet (Aussage zu diesem Produkt gefunden bzw. Ablenker verworfen) · Rot: abweichend · grau hinter der ID: Passage eines anderen Produkts · Karte anklicken für die Begründung";
    $("#entscheidung").innerHTML = "";
    detailSuche();
  }

  function detailSuche() {
    const p = gewaehlt && passage(gewaehlt);
    if (!p) return ($("#detail").innerHTML = "");
    const r = (sucheAktuell() ? suche().records : []).find((x) => x.passage_id === p.passage_id);
    const wert = !r ? "noch nicht geprüft" : r.status !== "ok" ? "failed" : r.relevant ? "gefunden" : "nicht relevant";
    $("#detail").innerHTML = `<div class="detail"><p><b>${esc(p.passage_id)}</b> <span class="muted">${esc(produktName(p.doc_id))} · Position ${p.position}${p.statement ? ` · Fragebogen: ${esc(p.statement)}` : ""}</span></p>
      <div class="zitat">${esc(p.text)}</div>
      <div class="urteile"><div class="urteil"><div class="titel">Aussagen suchen</div><div class="wert">${esc(wert)}</div>
        <div class="grund">${esc(r ? r.justification ?? r.errors.join("; ") : "")}</div></div></div></div>`;
  }

  // In der Schrittleiste anklickbar: Suche, sobald es eine gibt; Zuordnung, sobald sie läuft;
  // die späteren Schritte wie bisher erst mit gestartetem Paarvergleich.
  function klickbar(a) {
    if (a === "lieferanten") return true;
    if (a === "suche") return !!suche() && laufDaten();
    if (a === "zuordnung") return laufDaten() && (ansicht === "suche" || !!st.step5);
    return !!(st.step5 && a && (a !== "gate2" || st.gate2));
  }

  function zeichnen() {
    const laufend = st.running, gate = gateModus();
    $("#start").disabled = $("#fall").disabled = $("#passagen").disabled = laufend || !!st.step5?.running || !!suche()?.running;
    const alleFertig = gate && st.gate1 && faelle().every(fallFertig);

    const schritte = [
      ["Aussagen suchen", suche()?.running || (!suche()?.result && !laufDaten()) ? "aktiv" : suche()?.result ? "fertig" : "", "suche"],
      ["Zuordnung", laufend ? "aktiv" : st.result ? "fertig" : "", "zuordnung"],
      ["Gate 1", alleFertig ? "fertig" : gate ? "aktiv" : "", "zuordnung"],
      ["Paarvergleich", st.step5?.running ? "aktiv" : st.step5?.result ? "fertig" : "", "paarvergleich"],
      ["Gate 2", !st.gate2 ? "" : Object.values(st.gate2.cases).every((c) => ["done", "invalid"].includes(c.state)) ? "fertig" : "aktiv", "gate2"],
      ["Teil B: Lieferanten", ansicht === "lieferanten" ? "aktiv" : "", "lieferanten"],
    ];
    // Mit gestartetem Paarvergleich lässt sich über die Schrittleiste zurück zum Gate wechseln.
    $("#schritte").innerHTML = schritte.map(([n, k, a], i) =>
      (i ? '<span class="muted">→</span>' : "") +
      `<span class="schritt ${k}" ${klickbar(a) ? `data-ansicht="${a}"` : ""}>${k === "fertig" ? "✓ " : ""}${n}</span>`).join("");
    $("#spalten").classList.toggle("lf", ansicht === "lieferanten");
    if (ansicht === "lieferanten") return zeichnenLieferanten();
    // Schritt 1, solange es noch keine Zuordnung gibt, oder auf Klick in der Schrittleiste.
    if (ansicht === "suche" || !laufDaten()) return zeichnenSuche();
    if (st.step5 && ansicht === "gate2" && st.gate2) return zeichnenGate2();
    if (st.step5 && ansicht !== "zuordnung") return zeichnenPaarvergleich();

    const n = zuordnungsPassagen().length;
    let text = "";
    if (laufend) {
      const lauf = st.records.filter((r) => r.run === st.run);
      text = `Zuordnung · Lauf ${st.run}/${st.runs} · ${lauf.length} von ${n} gefundenen Aussagen zugeordnet · ${esc(st.provider)} ${esc(st.model)}`;
    }
    else if (st.error) text = `<span class="bad-text">Abgebrochen: ${esc(st.error)}</span>`;
    else if (st.result) {
      const ev = st.evaluation || [];
      const mittel = ev.length ? (ev.reduce((s, e) => s + e.exact_match, 0) / ev.length).toFixed(2) : null;
      text = `Zuordnung fertig · ${st.runs} Lauf/Läufe${mittel && !st.gate1 ? ` · Exact Match Ø ${mittel}` : ""} · ${esc(st.result)}`;
    }
    $("#statustext").innerHTML = text;
    const runs = [...new Set(st.records.map((r) => r.run))];
    const run = gate ? gateRun() : angezeigt ?? st.run ?? 1;
    $("#laeufe").innerHTML = runs.length > 1 && !st.gate1
      ? runs.map((r) => `<button class="${r === run ? "aktiv" : ""}" data-run="${r}">Lauf ${r}</button>`).join(" ") : "";

    // Fokus
    const fokus = $("#fokus");
    fokus.classList.toggle("laeuft", !!st.current);
    const letzte = st.records[st.records.length - 1];
    if (gate && !st.gate1) {
      fokus.innerHTML = `<div class="kopf">Gate 1: Zuordnung prüfen</div>
        <span class="muted">Ein Mensch prüft die Zuordnung von Lauf ${run}. Die Zeit läuft ab dem Öffnen.</span>
        <div class="zeile"><button class="primaer" id="gatestart">Gate 1 starten (Lauf ${run})</button></div>`;
    } else if (gate) {
      const tabs = faelle().map((d) => {
        const f = fallFertig(d);
        const zeichen = f ? (f.problem ? " ⚠" : f.decision === "continue" ? " ✓" : " ■") : "";
        return `<button class="${d === fall ? "aktiv" : ""}" data-fall="${esc(d)}">${esc(d)}${zeichen}</button>`;
      }).join(" ");
      const frei = faelle().filter((d) => fallFertig(d)?.decision === "continue");
      fokus.innerHTML = `<div class="kopf">Gate 1 · Lauf ${gateRun()} · Fall ${esc(fall ?? faelle()[0])}</div>
        ${faelle().length > 1 ? `<div class="zeile"><span class="faelle">${tabs}</span></div>` : ""}
        ${!alleFertig ? "" : frei.length ? `
          <div class="zeile"><b>Weiter mit Schritt 5: Paarvergleich</b>
            <span class="muted">${frei.length > 1 ? `${frei.length} freigegebene Fälle` : `Fall ${esc(frei[0])} freigegeben`} · Anbieter, Modell und Pause wie oben</span></div>
          <div class="zeile">
            <label class="muted">Läufe <input id="runs5" type="number" min="1" value="1" style="width:64px"></label>
            <span class="muted" title="Spec 07: Passagen mit ID im Prompt, jedes Urteil nennt Begründung und Belegstellen.">mit Begründung und Belegstellen</span>
            <button class="primaer" id="paarvergleich" ${st.step5?.running ? "disabled" : ""}>Paarvergleich starten</button></div>`
          : '<div class="zeile">Gate 1 abgeschlossen ohne continue, an Schritt 5 geht nichts.</div>'}`;
    } else if (st.current && run === st.run) {
      const p = passage(st.current);
      fokus.innerHTML = `<div class="kopf">Wird zugeordnet: ${esc(p.passage_id)} <span class="muted">${esc(herkunft(p))}</span></div>${esc(p.text)}`;
    } else if (letzte) {
      fokus.innerHTML = `<div class="kopf">Zuletzt: ${esc(letzte.passage_id)} → ${esc(ergebnis(letzte))}</div><span class="muted">${esc(letzte.justification ?? letzte.relevance_justification ?? letzte.errors.join("; "))}</span>`;
    } else {
      fokus.innerHTML = `<span class="muted">${n} gefundene Aussagen warten · Katalog ${esc(basis.criteria_file)}</span>`;
    }

    // Spalten
    const inGate = gate && st.gate1;
    const spalten = inGate ? spaltenGate() : spaltenLauf();
    $("#spalten").innerHTML = spalten.map((s) => {
      const leer = s.pruefen && !s.karten.length ? ' <span class="leer">KEINE EVIDENZ</span>' : "";
      return `<div class="spalte" data-code="${s.code}"><h2>${s.titel} <span>${s.karten.length || ""}</span>${leer}</h2>${s.karten.join("")}</div>`;
    }).join("");
    $("#legende").textContent = inGate
      ? "Karte anklicken für Text und Aktion, oder in eine andere Spalte ziehen · gestrichelt: noch keine Aktion · ✓ bestätigt · gelb: neu zugeordnet · Erwartete Kriterien sind im Gate ausgeblendet."
      : "Grün: Zuordnung stimmt mit expected_criteria überein · Rot: abweichend · Karte anklicken für die Begründung";

    entscheidung();
    detail();
  }

  function entscheidung() {
    if (!(gateModus() && st.gate1 && fall)) return ($("#entscheidung").innerHTML = "");
    const f = fallFertig(fall);
    if (f?.problem) {
      $("#entscheidung").innerHTML = `<div class="entscheidung"><b class="bad-text">Fall ${esc(fall)}: ${esc(f.problem)}</b>
        <span class="muted">· Nichts wird automatisch gelöscht oder überschrieben; bitte ${esc(f.file)} und das Ereignislog von Hand prüfen.</span></div>`;
      return;
    }
    if (f) {
      const c = f.counts;
      $("#entscheidung").innerHTML = `<div class="entscheidung"><b>Fall ${esc(fall)} abgeschlossen: ${esc(f.decision)}</b> → ${esc(f.status)}
        <span class="muted">· ${c.confirmed} bestätigt, ${c.reassigned} neu zugeordnet, ${c.deleted} gelöscht · ${esc(f.file)} (schreibgeschützt)</span></div>`;
      return;
    }
    const p = pruefen(fall);
    const hinweise = [
      `${p.anzahl - p.offen.length} von ${p.anzahl} Passagen bearbeitet`,
      p.ohneGrund.length ? `<span class="bad-text">Begründung fehlt: ${p.ohneGrund.join(", ")}</span>` : "",
      p.ohneEvidenz.length ? `<span class="bad-text">Kriterien ohne Evidenz: ${p.ohneEvidenz.join(", ")}</span>` : "",
    ].filter(Boolean).join(" · ");
    const weiterGeht = !p.offen.length && !p.ohneGrund.length && !p.ohneEvidenz.length;
    $("#entscheidung").innerHTML = `<div class="entscheidung leiste"><b>Entscheidung für Fall ${esc(fall)}</b><br><span class="muted">${hinweise}</span>
      <div class="zeile">${p.offen.length ? `<button id="restbestaetigen">Übrige ${p.offen.length} bestätigen</button>` : ""}
        <span style="flex:1"></span>
        <label class="muted">Prüfer <input id="reviewer" value="${esc(speicher.get("reviewer"))}" placeholder="Kürzel" size="8"></label>
        <button class="primaer" data-decision="continue" ${weiterGeht ? "" : "disabled"} title="${weiterGeht ? "" : "Erst jede Passage bearbeiten und jedes Kriterium belegen"}">continue</button>
        <button data-decision="need_more_input" ${p.ohneGrund.length ? "disabled" : ""}>need_more_input</button></div></div>`;
  }

  function detail() {
    if (!gewaehlt) return ($("#detail").innerHTML = "");
    const pid = gewaehlt, p = passage(pid);
    const r = st.records.find((x) => x.run === (gateModus() ? gateRun() : angezeigt ?? st.run) && x.passage_id === pid);
    if (!r) return ($("#detail").innerHTML = `<div class="detail"><p><b>${esc(pid)}</b></p><p>${esc(p.text)}</p><p class="muted">Noch nicht zugeordnet.</p></div>`);
    const kopf = `<p><b>${esc(pid)}</b> <span class="muted">${esc(herkunft(p))} · Dokument ${esc(p.doc_id)}, Position ${p.position}</span></p><div class="zitat">${esc(p.text)}</div>`;
    const inGate = gateModus() && st.gate1;
    const urteil = (titel, wert, grund) => `<div class="urteil"><div class="titel">${titel}</div><div class="wert">${esc(wert)}</div><div class="grund">${esc(grund)}</div></div>`;
    const urteile = `<div class="urteile">
      ${(() => { const t = suche()?.records.find((x) => x.passage_id === pid);
        return t ? urteil("Aussagen suchen", t.relevant ? "gefunden" : "nicht relevant", t.justification) : ""; })()}
      ${aussortiert(r) ? "" : urteil("Zuordnung des Agenten", inGate ? agent(r) : ergebnis(r), r.justification ?? "Zuordnung fehlgeschlagen: " + r.errors.join("; "))}
      ${inGate || erwartetFuer(p, st.case ?? p.doc_id) == null ? "" : urteil("Erwartet", erwartetFuer(p, st.case ?? p.doc_id).join(", ") || "none", p.doc_id !== (st.case ?? p.doc_id) ? `Passage gehört zu ${produktName(p.doc_id)}` : "")}
    </div>`;

    if (!inGate) {
      $("#detail").innerHTML = `<div class="detail">${kopf}${urteile}</div>`;
      return;
    }
    const z = zustand(r.doc_id, r), gesperrt = !!fallFertig(r.doc_id) || r.doc_id !== fall;
    const ziele = [...codes(), "none"].filter((c) => c !== agent(r));
    const aus = gesperrt ? "disabled" : "";
    const mein = z.action === "delete" || z.action === "reassign"
      ? `<div class="mein"><b>${z.action === "delete" ? "Gelöscht" : `Neu: ${esc(z.ziel)} statt ${esc(agent(r))}`}</b> · ${esc(z.reason)}
          ${gesperrt ? "" : `<button data-aktion="${z.action}" ${z.action === "reassign" ? `data-ziel="${esc(z.ziel)}"` : ""}>Begründung ändern</button>`}</div>`
      : "";
    $("#detail").innerHTML = `<div class="detail">${kopf}${urteile}
      <div class="aktionen">
        <button data-aktion="confirm" class="${z.action === "confirm" ? "aktiv" : ""}" ${aus}>✓ Bestätigen</button>
        <button data-aktion="delete" class="${z.action === "delete" ? "aktiv" : ""}" ${aus}>Löschen</button>
        <span class="trenner"></span><span class="muted">Neu zuordnen</span>${ziele.map((c) =>
          `<button data-aktion="reassign" data-ziel="${c}" class="${z.action === "reassign" && z.ziel === c ? "aktiv" : ""}" ${aus}>${c}</button>`).join("")}
      </div>${mein}</div>`;
  }

  // -------------------------------------------------- Schritt 5: Paarvergleich

  async function paarvergleichStarten() {
    fehler();
    try {
      st = await api("/api/step5/start", { provider: $("#provider").value, model: $("#model").value,
        pause: Number($("#pause").value), runs: Number($("#runs5").value) });
      ansicht = "paarvergleich";
      abfragen();
    } catch (e) { fehler(e); }
  }

  function zeichnenPaarvergleich() {
    const s5 = st.step5, run = s5.run, name = (id) => s5.names[id] ?? id;
    const urteil = (c) => (c.preference in s5.names ? `${name(c.preference)} ${c.intensity}` : c.preference);
    const fertigImLauf = s5.responses.filter((r) => r.run === run).length;
    const umfang = s5.cases.length > 1 ? `${fertigImLauf} von ${s5.cases.length} Fällen` : esc(s5.cases[0]?.title ?? "");
    let text = `Paarvergleich${s5.evidence ? " · mit Belegstellen" : s5.justification ? " · mit Begründung" : ""} · Lauf ${run}/${s5.runs} · ${umfang} · ${esc(s5.provider)} ${esc(s5.model)}`;
    if (s5.error) text = `<span class="bad-text">Paarvergleich abgebrochen: ${esc(s5.error)}</span>`;
    else if (s5.result) text = `Paarvergleich fertig · ${s5.runs} Lauf/Läufe · ${esc(s5.result)}`;
    $("#statustext").innerHTML = text;
    $("#laeufe").innerHTML = "";

    const fokus = $("#fokus"), aktuell = s5.cases.find((c) => c.id === s5.current);
    fokus.classList.toggle("laeuft", !!aktuell);
    fokus.innerHTML = aktuell
      ? `<div class="kopf">Wird verglichen: ${esc(aktuell.title)}</div><span class="muted">Das Modell liest die Aussagen unten und füllt die Paarvergleiche aus.</span>`
      : s5.result ? `<div class="kopf">Paarvergleich abgeschlossen</div><span class="muted">Rohurteile in ${esc(s5.result)}. Gewichte und CR rechnet der Code in Gate 2.</span>
          ${st.gate2 ? '<div class="zeile"><button class="primaer" id="gate2start">Weiter mit Gate 2</button></div>' : ""}`
      : `<span class="muted">Startet …</span>`;

    $("#spalten").innerHTML = s5.cases.map((c) => {
      const alle = s5.responses.filter((r) => r.case_id === c.id);
      const r = alle.find((x) => x.run === run);
      const aussagen = `<ul>${c.statements.map(([n, t]) => `<li><b>${esc(n)}:</b> ${esc(t)}</li>`).join("")}</ul>`;
      let urteile = `<p class="muted">${s5.current === c.id ? "wird verglichen …" : "wartet"}</p>`;
      if (r && !r.valid) urteile = `<p class="bad-text">Ungültig: ${esc(r.errors.join("; "))}</p>`;
      else if (r) {
        urteile = `<table>${r.comparisons.map((cmp) => {
          // Über alle Läufe: häufigstes Urteil je Paar
          const zaehler = {};
          alle.filter((x) => x.valid).forEach((x) => {
            const u = urteil(x.comparisons.find((y) => y.a === cmp.a && y.b === cmp.b) ?? {});
            zaehler[u] = (zaehler[u] || 0) + 1;
          });
          const top = Object.entries(zaehler).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u, k]) => `${esc(u)} (${k})`).join(" · ");
          const belege = cmp.evidence ? ` · Belege: ${cmp.evidence.length ? esc(cmp.evidence.join(", ")) : "keine"}` : "";
          const grund = cmp.justification ? `<tr><td colspan="2" class="muted" style="border-top:none; padding-top:0">${esc(cmp.justification)}${belege}</td></tr>` : "";
          return `<tr><td>${esc(name(cmp.a))} vs. ${esc(name(cmp.b))}</td><td><b>${esc(urteil(cmp))}</b>${s5.runs > 1 ? `<br><span class="muted">${top}</span>` : ""}</td></tr>${grund}`;
        }).join("")}</table>`;
      }
      return `<div class="spalte ${s5.current === c.id ? "jetzt" : ""}"><h2>${esc(c.title)}</h2>${aussagen}${urteile}</div>`;
    }).join("");
    $("#legende").textContent = "Fett: Urteil im aktuellen Lauf (bevorzugtes Kriterium und Intensität) · bei mehreren Läufen darunter die häufigsten Urteile mit Anzahl"
      + (s5.justification ? " · grau darunter: Begründung des Modells im aktuellen Lauf." : ".");
    $("#entscheidung").innerHTML = "";
    $("#detail").innerHTML = "";
  }


  // ------------------------------------------------------------------ Gate 2

  const paarKey = (p) => p.pair.join("|");

  function g2Fall() {
    const faelle2 = Object.keys(st.gate2.cases);
    if (!fall2 || !st.gate2.cases[fall2]) fall2 = faelle2.find((c) => ["open", "active"].includes(st.gate2.cases[c].state)) ?? faelle2[0];
    return st.gate2.cases[fall2];
  }

  function g2Pruefen(f) {
    const e = entwurf2[fall2] ?? {};
    const offen = f.pairs.filter((p) => !e[paarKey(p)]?.action).length;
    const ohneGrund = f.pairs.filter((p) => ["revise", "set"].includes(e[paarKey(p)]?.action) && !(e[paarKey(p)].reason ?? "").trim()).length;
    const ohneWert = f.pairs.filter((p) => e[paarKey(p)]?.action === "set" && !e[paarKey(p)].preference).length;
    return { offen, ohneGrund, ohneWert, fertig: !offen && !ohneGrund && !ohneWert };
  }

  function zeichnenGate2() {
    const g2 = st.gate2, f = g2Fall(), faelle2 = Object.keys(g2.cases);
    const fertig = faelle2.filter((c) => g2.cases[c].state === "done").length;
    $("#statustext").innerHTML = `Gate 2 · Lauf ${g2.run} von Schritt 5 · ` + (faelle2.length > 1
      ? `${fertig} von ${faelle2.length} Fällen abgeschlossen` : `Fall ${esc(fall2)}${fertig ? " abgeschlossen" : ""}`);
    $("#laeufe").innerHTML = "";
    const zeichen = { done: (c) => (g2.cases[c].decision === "accept" ? " ✓" : " ■"), problem: () => " ⚠", invalid: () => " ✗", active: () => " •", open: () => "" };
    const tabs = faelle2.map((c) => `<button class="${c === fall2 ? "aktiv" : ""}" data-fall2="${esc(c)}">${esc(c)}${zeichen[g2.cases[c].state](c)}</button>`).join(" ");
    const fokus = $("#fokus");
    fokus.classList.remove("laeuft");
    fokus.innerHTML = `<div class="kopf">Gate 2: Paarvergleiche und Gewichte prüfen</div>
      <span class="muted">Je Paar zuerst die Evidenz, dann der Vorschlag des Modells. Gewichte und CR rechnet der Code.</span>
      <div class="zeile"><label class="muted">Prüfer <input id="reviewer" value="${esc(speicher.get("reviewer"))}" placeholder="Kürzel" size="8"></label>
        ${faelle2.length > 1 ? `<span class="faelle">${tabs}</span>` : ""}</div>
      ${f?.state === "open" ? `<div class="zeile">
        <label class="muted" title="Spec 06, nur Demo: liegt CR über der Schwelle, gehen die Urteile vorab bis zu dreimal an den Agenten. In Evaluationsläufen aus."><input id="reparatur2" type="checkbox"> automatische CR-Reparatur vorab</label>
        <button class="primaer" id="gate2oeffnen">Fall ${esc(fall2)} öffnen</button></div>` : ""}`;

    $("#spalten").innerHTML = f?.state === "active" ? f.pairs.map((p) => g2Karte(f, p)).join("") : "";
    $("#legende").textContent = f?.state === "active"
      ? "Je Paar eine Aktion: bestätigen, mit Kommentar an den Agenten zurückgeben (revise) oder selbst setzen (set). Im letzten Zyklus kein revise."
      : "";
    $("#detail").innerHTML = "";
    g2Entscheidung(f);
  }

  function g2Karte(f, p) {
    const name = (id) => f.names[id] ?? id;
    const [a, b] = p.pair, key = paarKey(p), e = entwurf2[fall2]?.[key] ?? {};
    const vorschlag = p.preference === "gleich" ? "gleich wichtig" : `${name(p.preference)} wichtiger, Intensität ${p.intensity}`;
    // Belegstellen: zitierte Passagen nur markieren, nicht doppelt zeigen.
    const zitiert = (pid) => p.cited?.includes(pid) ? ' <span class="muted">· zitiert</span>' : "";
    const passagen = (liste) => liste.map(([pid, t]) => `<li><b>[${esc(pid)}]</b> ${esc(t)}${zitiert(pid)}</li>`).join("");
    const ohneBeleg = p.cited && !p.cited.length ? '<p class="muted">Das Modell zitiert keine Passage (Urteil nur aus Modellwissen).</p>' : "";
    const evidenz = [a, b].map((cid) => `<p class="muted" style="margin:0"><b>${esc(name(cid))}</b></p><ul>${passagen(p.evidence[cid])}</ul>`).join("");
    const urteil = (u) => (u.preference === "gleich" ? "gleich wichtig" : `${name(u.preference)} ${u.intensity}`);
    const verlauf = p.history.length ? `<p class="muted" style="margin:0"><b>Bisherige Zyklen</b></p><ul>${p.history.map((h) =>
      `<li>Zyklus ${h.cycle} · ${h.action === "revise" ? "zurück an Agent" : "selbst gesetzt"}: „${esc(h.reason)}“ · ${esc(urteil(h.before))} → ${esc(urteil(h.after))}</li>`).join("")}</ul>` : "";
    const knopf = (aktion, text, aus = false) =>
      `<button data-g2aktion="${aktion}" data-paar="${esc(key)}" class="${e.action === aktion ? "aktiv" : ""}" ${aus ? "disabled" : ""}>${text}</button>`;
    const setzen = e.action !== "set" ? "" : `<div class="zeile">
      <select data-g2feld="preference" data-paar="${esc(key)}"><option value="">wichtiger …</option>${[a, b, "gleich"].map((c) =>
        `<option value="${c}" ${e.preference === c ? "selected" : ""}>${c === "gleich" ? "gleich wichtig" : esc(name(c))}</option>`).join("")}</select>
      ${e.preference && e.preference !== "gleich" ? `<select data-g2feld="intensity" data-paar="${esc(key)}">${[2, 3, 4, 5, 6, 7, 8, 9].map((i) =>
        `<option ${Number(e.intensity) === i ? "selected" : ""}>${i}</option>`).join("")}</select>` : ""}</div>`;
    const grund = ["revise", "set"].includes(e.action)
      ? `<textarea data-g2feld="reason" data-paar="${esc(key)}" placeholder="${e.action === "revise" ? "Kommentar an den Agenten (Pflicht)" : "Begründung (Pflicht)"}">${esc(e.reason ?? "")}</textarea>` : "";
    return `<div class="spalte"><h2>${esc(name(a))} vs. ${esc(name(b))}</h2>${evidenz}${ohneBeleg}
      ${p.justification ? `<p class="muted">Begründung des Modells: ${esc(p.justification)}</p>` : ""}
      ${verlauf}
      <p><b>Vorschlag:</b> ${esc(vorschlag)}</p>
      <div class="zeile">${knopf("confirm", "Bestätigen")}${knopf("revise", "Zurück an Agent", !f.revise_allowed)}${knopf("set", "Selbst setzen")}</div>
      ${setzen}${grund}</div>`;
  }

  function g2Entscheidung(f) {
    if (!f) return ($("#entscheidung").innerHTML = "");
    const name = (id) => f.names?.[id] ?? id;
    const gewichte = (ev) => Object.entries(ev.weights).map(([c, w]) => `${esc(name(c))} ${w.toFixed(3)}`).join(" · ");
    if (f.state === "done") {
      const ev = f.final.evaluation;
      $("#entscheidung").innerHTML = `<div class="entscheidung"><b>Fall ${esc(fall2)} abgeschlossen: ${esc(f.decision)}</b> → ${esc(f.status)}
        <br><span class="muted">${gewichte(ev)} · CR ${ev.cr.toFixed(3)} (Schwelle ${ev.cr_threshold}) · CR₀ ${f.cr_0.toFixed(3)} · ${f.cycles} Zyklus/Zyklen · ${esc(f.file)} (schreibgeschützt)</span></div>`;
      return;
    }
    if (f.state === "problem") return ($("#entscheidung").innerHTML = `<div class="entscheidung"><b class="bad-text">Fall ${esc(fall2)}: ${esc(f.problem)}</b></div>`);
    if (f.state === "invalid") return ($("#entscheidung").innerHTML = `<div class="entscheidung"><b>Fall ${esc(fall2)}:</b> ungültige Antwort aus Schritt 5, kommt nicht in Gate 2 <span class="muted">(${esc(f.errors.join("; "))})</span></div>`);
    if (f.state !== "active") return ($("#entscheidung").innerHTML = "");
    const ev = f.evaluation, p = g2Pruefen(f);
    const ueber = ev.consistent ? "" : ' <b class="bad-text">CR über der Schwelle</b>';
    const reparatur = f.repair ? ` · Reparatur vorab: CR₀ ${f.repair.cr_0.toFixed(3)} → ${f.repair.cr_after_repair.toFixed(3)} in ${f.repair.repair_attempts.length} Versuch(en)${f.repair.repair_warning ? " ⚠" : ""}` : "";
    const zyklus = Math.min(f.cycle, f.max_cycles);
    const hinweise = f.hints.map((h) => `<br><span class="bad-text">${esc(h)}</span>`).join("");
    const aktionen = f.can_decide
      ? `<div class="zeile"><input id="g2grund" placeholder="Begründung zur Entscheidung (optional)" style="flex:1; min-width:200px">
          <button class="primaer" data-g2decision="accept">accept</button><button data-g2decision="reject">reject</button></div>`
      : `<div class="zeile">${p.offen ? `<button id="g2rest">Übrige ${p.offen} bestätigen</button>` : ""}
          <button class="primaer" id="g2zyklus" ${p.fertig ? "" : "disabled"} title="${p.fertig ? "" : "Jedes Urteil braucht eine Aktion, revise und set eine Begründung, set einen Wert"}">Zyklus ${zyklus} abschließen</button></div>`;
    $("#entscheidung").innerHTML = `<div class="entscheidung"><b>Gewichte:</b> ${gewichte(ev)}
      <br><b>CR ${ev.cr.toFixed(3)}</b> · Schwelle ${ev.cr_threshold}${ueber}
      <br><span class="muted">${f.can_decide ? "Prüfung beendet, bitte entscheiden" : `Zyklus ${zyklus} von max. ${f.max_cycles}`} · CR₀ ${f.initial_cr.toFixed(3)}${reparatur}</span>${hinweise}
      ${aktionen}</div>`;
  }

  async function g2Api(pfad, body, warten = "") {
    fehler();
    if (warten) $("#statustext").textContent = warten;
    try { st = await api(pfad, body); } catch (e) { fehler(e); }
    zeichnen();

  // ------------------------------------------------------- Teil B: Lieferanten
  // Nur lesend. Zeigt die Rohdaten aus data/partb/, keine Kennzahlen.

  const zahl = (x, d = 0) => (x == null ? "–" : Number(x).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const eur = (x) => (x == null ? "–" : `${zahl(x, 2)} €`);
  const datum = (s) => (s ? s.split("-").reverse().join(".") : "–");
  const DE = {
    volume_up: "Menge +", volume_down: "Menge −", variant_switch: "Variantenwechsel", revision_change: "Änderungsstand",
    accepted: "angenommen", partial: "teilweise", rejected: "abgelehnt",
    incoming_inspection: "Wareneingang", field_warranty: "Gewährleistung (Feld)", return: "Rückläufer",
    out_of_spec: "außerhalb Spezifikation", damaged: "beschädigt", wrong_configuration: "falsche Ausführung",
    late_asn: "Lieferavis zu spät", invoice_mismatch: "Rechnung abweichend", missing_certificate: "Zertifikat fehlt",
    missing_delivery_note: "Lieferschein fehlt", edi: "EDI", email: "E-Mail/PDF",
  };
  const de = (s) => (s == null ? "–" : DE[s] ?? s);
  const strip = (liste, klasse, titel) =>
    `<span class="strip">${liste.map((x) => `<i class="q ${klasse(x)}" title="${esc(titel(x))}"></i>`).join("")}</span>`;
  const fallTitel = (id) => (basis.cases.find((c) => c.id === id)?.title ?? id).replace(/^Fall \d+: /, "");

  // Gewichte des Falls aus Gate 2. Teil B nutzt nur Gewichte, die vor dem
  // Lieferantenvergleich feststehen (R11): Gate 2 mit accept abgeschlossen.
  function gewichteTeilB(id) {
    const g = st.gate2?.cases?.[id];
    if (g?.state === "done" && g.decision === "accept") {
      const ev = g.final.evaluation, name = (c) => st.step5?.names?.[c] ?? c;
      const liste = Object.entries(ev.weights).map(([c, w]) => `${esc(name(c))} ${w.toFixed(3)}`).join(" · ");
      return `<span><b>Gewichte aus Gate 2</b> (Lauf ${st.gate2.run}, accept): ${liste}
        <span class="muted">· CR ${ev.cr.toFixed(3)} (Schwelle ${ev.cr_threshold})</span></span>`;
    }
    if (g?.state === "done") return `<span class="muted">Gate 2 mit ${esc(g.decision)} abgeschlossen: für diesen Fall gibt es keine Gewichte.</span>`;
    return `<span class="muted">Gewichte stehen noch nicht fest: ${g ? "Gate 2 für diesen Fall ist noch offen." : "kein Durchlauf bis Gate 2 für diesen Fall."}</span>`;
  }

  function zeichnenLieferanten() {

    $("#entscheidung").innerHTML = "";
    if (!partb) {

      api("/api/partb").then((d) => { partb = d; zeichnen(); })
        .catch((e) => { partb = { available: false, error: e.message ?? String(e) }; zeichnen(); });

      <div class="zeile muted">Bedarf nächste Periode ${zahl(dem.annual_demand_units)} Stück · max. Fehlerquote ${zahl((dem.max_defect_rate ?? 0) * 100)} %
        ${zr ? ` · Historie ${datum(zr.start)} bis ${datum(zr.end)}` : ""}</div>
      <div class="zeile">${gewichteTeilB(lfFall)}</div>

    const td = (v, klasse = "") => `<td class="${klasse}">${v}</td>`;

    if (lfTab === "changes") {
      datei = "change_requests.csv";

        s.orders.map((x) => `<tr>${td(esc(x.po_id))}${td(datum(x.order_date))}${td(zahl(x.qty_ordered), "num")}${td(eur(x.unit_price_eur), "num")}
          ${td(datum(x.commit_date))}${td(datum(x.receipt_date), x.on_time ? "" : "bad")}${td(zahl(x.qty_received), x.in_full ? "num" : "num bad")}
          ${td(zahl(x.qty_rejected), x.qty_rejected ? "num bad" : "num")}${td(esc(x.rejection_reason ? de(x.rejection_reason) : ""))}
          ${td(x.docs ? "ok" : esc(de(x.doc_issue)), x.docs ? "" : "bad")}${td(eur(x.freight_eur), "num")}</tr>`));
    }
    $("#detail").innerHTML = `<div class="detail"><div class="kopf"><b>${esc(s.supplier_name)}</b> <span class="muted">· Einzeldaten aus ${esc(partb.dir)}/${datei}</span></div>
      <div class="zeile">${reiter}</div>${inhalt}
      <p class="legende muted">Rot: Termin verfehlt, Menge unvollständig, Befund oder Dokumentenfehler · bei Änderungsanfragen rot: später umgesetzt als gebraucht.</p></div>`;
  }

  // ------------------------------------------------------------------ Abfrage

  async function abfragen() {
    try {
      st = await api("/api/status");
    } catch (e) { fehler(e); }
    if (st.search && !formGeaendert) { $("#fall").value = st.search.case; $("#passagen").value = st.search.passages_file; }
    if (gateModus() && st.gate1 && !fall) fall = faelle().find((d) => !fallFertig(d)) ?? faelle()[0];
    zeichnen();
    clearTimeout(timer);
    if (st.running || st.step5?.running || st.search?.running) timer = setTimeout(abfragen, 500);
  }

  // ----------------------------------------------------------------- Ereignisse

  $("#form").onsubmit = async (e) => {
    e.preventDefault();
    const offen = gateModus() && st.gate1 && faelle().some((d) => !fallFertig(d));
    if (offen && !confirm("Gate 1 ist noch nicht abgeschlossen. Trotzdem einen neuen Lauf starten?")) return;
    fehler();
    speicher.set("fall", $("#fall").value);
    speicher.set("passagen", $("#passagen").value);
    try {
      formGeaendert = false;
      st = await api("/api/search/start", { provider: $("#provider").value, model: $("#model").value, case: $("#fall").value,
        passages: $("#passagen").value, pause: Number($("#pause").value) });
      angezeigt = null; gewaehlt = null; gesehen = new Set(); fall = null; entwurf = {}; ansicht = null;
      abfragen();
    } catch (err) { fehler(err); }
  };

  async function zuordnen() {
    fehler();
    try {
      st = await api("/api/start", { provider: $("#provider").value, model: $("#model").value,
        runs: Number($("#runs").value), pause: Number($("#pause").value) });
      angezeigt = null; gewaehlt = null; gesehen = new Set(); fall = null; entwurf = {}; ansicht = null;
      abfragen();
    } catch (err) { fehler(err); }
  }

  $("#fokus").onclick = (e) => {
    if (e.target.id === "zuordnen" && !e.target.disabled) return zuordnen();
    if (e.target.dataset?.ansichtZiel) { ansicht = e.target.dataset.ansichtZiel; gewaehlt = null; return zeichnen(); }
    if (e.target.id === "lfzurueck") { ansicht = null; if (partb?.error) partb = null; fehler(); return zeichnen(); }
    if (e.target.dataset?.lfall) { lfFall = e.target.dataset.lfall; lfWahl = null; return zeichnen(); }
    if (e.target.id === "gatestart") return oeffnen(faelle()[0]);
    if (e.target.id === "paarvergleich") return paarvergleichStarten();
    if (e.target.id === "gate2start") { ansicht = "gate2"; return zeichnen(); }
    if (e.target.dataset?.fall2) { fall2 = e.target.dataset.fall2; return zeichnen(); }
    if (e.target.id === "gate2oeffnen") {
      const reviewer = $("#reviewer").value.trim();
      if (!reviewer) return fehler("Bitte zuerst ein Kürzel als Prüfer eintragen.");
      speicher.set("reviewer", reviewer);
      const reparatur = $("#reparatur2").checked;
      return g2Api("/api/gate2/open", { run: st.gate2.run, case_id: fall2, reviewer, repair: reparatur },
        reparatur ? "Reparatur läuft …" : "");
    }
    const d = e.target.dataset?.fall;
    if (d) fallFertig(d) ? ((fall = d), (gewaehlt = null), zeichnen()) : oeffnen(d);
  };
  // Vor dem Start zeigen die Spalten die Passagen des gewählten Falls.
  $("#fall").onchange = () => { formGeaendert = true; speicher.set("fall", $("#fall").value); zeichnen(); };
  $("#passagen").onchange = () => { formGeaendert = true; speicher.set("passagen", $("#passagen").value); zeichnen(); };
  $("#fokus").onchange = (e) => { if (e.target.id === "reviewer") speicher.set("reviewer", e.target.value.trim()); };

  $("#spalten").onclick = (e) => {
    const lieferant = e.target.closest("[data-lsup]");
    if (lieferant && ansicht === "lieferanten") { lfWahl = lieferant.dataset.lsup; return zeichnen(); }
    const knopf = e.target.closest("[data-g2aktion]");
    if (knopf && !knopf.disabled) {
      const eintrag = ((entwurf2[fall2] ??= {})[knopf.dataset.paar] ??= {});
      eintrag.action = knopf.dataset.g2aktion;
      if (eintrag.action !== "set") { delete eintrag.preference; delete eintrag.intensity; }
      return zeichnen();
    }
    const chip = e.target.closest(".chip");
    if (chip) { gewaehlt = chip.dataset.pid; zeichnen(); }
  };
  $("#spalten").oninput = (e) => {
    const feld = e.target.dataset?.g2feld;
    if (!feld) return;
    const eintrag = ((entwurf2[fall2] ??= {})[e.target.dataset.paar] ??= {});
    eintrag[feld] = e.target.value;
    if (feld === "preference") eintrag.intensity = e.target.value && e.target.value !== "gleich" ? eintrag.intensity ?? 2 : 0;
    if (feld === "reason") return g2Entscheidung(g2Fall());  // Fokus im Textfeld behalten
    zeichnen();
  };
  $("#spalten").ondragstart = (e) => {
    const chip = e.target.closest(".chip");
    if (chip) e.dataTransfer.setData("text/plain", chip.dataset.pid);
  };
  $("#spalten").ondragover = (e) => {
    const spalte = e.target.closest(".spalte");
    if (!spalte || !fall || fallFertig(fall)) return;
    e.preventDefault();
    document.querySelectorAll(".spalte.ziel").forEach((s) => s !== spalte && s.classList.remove("ziel"));
    spalte.classList.add("ziel");
  };
  $("#spalten").ondragleave = (e) => {
    const spalte = e.target.closest(".spalte");
    if (spalte && !spalte.contains(e.relatedTarget)) spalte.classList.remove("ziel");
  };
  $("#spalten").ondrop = (e) => {
    e.preventDefault();
    const spalte = e.target.closest(".spalte"), pid = e.dataTransfer.getData("text/plain");
    if (!spalte || !pid) return;
    const code = spalte.dataset.code;
    gewaehlt = pid;
    zeichnen();
    if (code === "geloescht") handeln(pid, "delete");
    else handeln(pid, "reassign", code);  // zurück in die Ursprungsspalte = confirm
  };

  $("#detail").onclick = (e) => {
    const reiter = e.target.closest("[data-ltab]");
    if (reiter && ansicht === "lieferanten") { lfTab = reiter.dataset.ltab; return zeichnen(); }
    const b = e.target.closest("[data-aktion]");
    if (!b || b.disabled) return;
    handeln(gewaehlt, b.dataset.aktion, b.dataset.ziel ?? null);
  };

  $("#entscheidung").oninput = (e) => { if (e.target.id === "reviewer") speicher.set("reviewer", e.target.value.trim()); };
  $("#entscheidung").onclick = (e) => {
    if (st.step5 && ansicht === "gate2" && st.gate2) {
      const f = g2Fall();
      if (e.target.id === "g2rest") {
        for (const p of f.pairs) ((entwurf2[fall2] ??= {})[paarKey(p)] ??= {}).action ??= "confirm";
        return zeichnen();
      }
      if (e.target.id === "g2zyklus" && !e.target.disabled) {
        const actions = f.pairs.map((p) => ({ pair: p.pair, ...entwurf2[fall2][paarKey(p)] }));
        const revise = actions.some((a) => a.action === "revise");
        entwurf2[fall2] = {};
        return g2Api("/api/gate2/cycle", { case_id: fall2, actions }, revise ? "Revision durch den Agenten läuft …" : "");
      }
      const d = e.target.dataset?.g2decision;
      if (d && confirm(`Fall ${fall2} mit „${d}“ abschließen? Danach ist nichts mehr änderbar.`))
        return g2Api("/api/gate2/close", { case_id: fall2, decision: d, reason: $("#g2grund").value });
      return;
    }
    if (e.target.id === "restbestaetigen") {
      for (const pid of pruefen(fall).offen) setzen(pid, "confirm");
      return;
    }
    const d = e.target.dataset?.decision;
    if (d && !e.target.disabled) abschliessen(d);
  };

  $("#schritte").onclick = (e) => {
    const a = e.target.closest("[data-ansicht]")?.dataset.ansicht;
    if (a) { ansicht = a; gewaehlt = null; zeichnen(); }
  };
  $("#laeufe").onclick = (e) => {
    const r = e.target.dataset.run;
    if (r) { angezeigt = Number(r) === st.run && st.running ? null : Number(r); zeichnen(); }
  };

  (async () => {
    try {
      basis = await api("/api/basis");
      $("#fall").innerHTML = basis.cases.map((c) => `<option value="${esc(c.id)}">${esc(produktName(c.id))}</option>`).join("");
      if (basis.cases.some((c) => c.id === speicher.get("fall"))) $("#fall").value = speicher.get("fall");
      const dateien = Object.keys(basis.passages);
      $("#passagen").innerHTML = dateien.map((d) =>
        `<option value="${esc(d)}">${esc(d.replace(/^passages_|\.csv$/g, ""))} (${basis.passages[d].length})</option>`).join("");
      $("#passagen").value = [speicher.get("passagen"), "passages_hidden.csv", basis.default_passages].find((d) => dateien.includes(d));
      abfragen();
    } catch (e) { fehler(e); }
  })();
</script>
</body>
</html>
