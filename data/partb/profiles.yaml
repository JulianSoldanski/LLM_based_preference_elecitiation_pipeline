# Parameter für die synthetischen Rohdaten von Teil B (Bike Inc.).
#
# WICHTIG: Alle Lieferanten und Werte sind erfunden. Sie sind an den Fall von
# Wang et al. (2004, Abschnitt 5, Tabelle 4) angelehnt:
#
#   * Je Bauteil drei Lieferanten, je einer lean-, agil- und hybrid-orientiert
#     (bei Wang A1/A2/A3). Wie bei Wang gilt dasselbe Lieferantenmuster für
#     alle drei Bauteile.
#   * Direkt aus Wang Tabelle 4 übernommen: Fehlerquote (1/3/2 %), Fill Rate
#     (80/90/98 %), Reihenfolge der Stückpreise, Kapazität relativ zum Bedarf,
#     maximal zulässige Fehlerquote (2 %).
#   * Wofür Wang keine Daten gibt (Termintreue, Lieferzeit, Flexibilität,
#     Dokumente), folgen die Werte der Beschreibung der drei Strategien in
#     Wang Tabelle 2 (lean: niedrige Kosten, hohe Qualität; agil:
#     Geschwindigkeit, Flexibilität, kurze Lieferzeiten; hybrid: dazwischen).
#     NICHT verwendet werden die Bewertungen der Alternativen in Wang
#     Tabelle 8: Das sind subjektive Paarvergleichsurteile, keine Daten.
#
# Abweichung von Wang (Design decision): Die Stückpreise stehen bei Wang im
# Verhältnis 1 : 4 : 2 (0,6 / 2,4 / 1,2 $). Für reale Bauteile ist ein
# vierfacher Preis unplausibel. Übernommen wird die Reihenfolge
# (lean < hybrid < agil), die Spanne ist gestaucht (price_factor).
#
# Zeitraum: zwölf Monate Bestellhistorie. "conditions.csv" ist das aktuelle
# Angebot für die nächste Periode.

seed: 20261101
period_start: 2025-11-01
period_end: 2026-10-31

# Interne Prozesskostensätze von Bike Inc. (EUR je Vorgang).
process_cost_rates:
  - {activity: po_processing,  channel: edi,   cost_eur: 12.0}
  - {activity: po_processing,  channel: email, cost_eur: 48.0}
  - {activity: goods_receipt,  channel: any,   cost_eur: 22.0}
  - {activity: invoice_check,  channel: edi,   cost_eur: 6.0}
  - {activity: invoice_check,  channel: email, cost_eur: 18.0}
  - {activity: doc_correction, channel: any,   cost_eur: 35.0}

# ---------------------------------------------------------------------------
# Lieferantentypen. Buchstabe A/B/C entspricht Wang A1/A2/A3.
#
#   p_in_full        Anteil Lieferungen mit vollständiger Menge.
#                    = Fill Rate bei Wang (Annahme dieser Arbeit: Fill Rate
#                      als Anteil vollständig gelieferter Bestellungen gelesen)
#   defect_rate      fehlerhafte Stück / gelieferte Stück (Wang Tabelle 4)
#   incoming_share   Anteil der Fehler, der schon im Wareneingang auffällt;
#                    der Rest kommt als Feldreklamation oder Rückläufer
#   p_condition_ok   Anteil Lieferungen ohne Befund im Wareneingang
#   p_on_time        Anteil Lieferungen bis zum zugesagten Termin
#   late_days        Verspätung in Arbeitstagen, falls verspätet
#   short_pct        Fehlmenge in %, falls nicht vollständig
#   p_docs_ok        Anteil Lieferungen mit korrekten Dokumenten
#   lead_time_days   zugesagte Wiederbeschaffungszeit
#   p_change_accepted / p_change_partial, change_days   Reaktion auf Änderungen
#   price_factor     Stückpreis = base_price des Bauteils × Faktor
#   freight_factor   Fracht je Lieferung = base_freight × Faktor
#   lot_factor       Losgröße relativ zur Spanne des Bauteils
#   order_channel    edi oder email (bestimmt interne Prozesskosten)
#
# Die Anteile p_* werden in den Daten exakt getroffen (gerundet); zufällig
# ist nur, welche Bestellungen betroffen sind. Ebenso die Fehlerquote.
archetypes:
  lean:                      # Wang A1: billig, wenig Fehler, Fill Rate 80 %
    letter: A
    p_in_full: 0.80
    defect_rate: 0.01
    incoming_share: 0.6
    p_condition_ok: 0.92
    p_on_time: 0.94
    late_days: [2, 8]
    short_pct: [5, 20]
    p_docs_ok: 0.88
    lead_time_days: 42
    p_change_accepted: 0.25
    p_change_partial: 0.30
    change_days: [20, 38]
    price_factor: 0.80
    freight_factor: 3.0
    lot_factor: 1.6
    order_channel: email

  agile:                     # Wang A2: teuer, 3 % Fehler, Fill Rate 90 %, schnell und flexibel
    letter: B
    p_in_full: 0.90
    defect_rate: 0.03
    incoming_share: 0.6
    p_condition_ok: 0.80
    p_on_time: 0.90
    late_days: [1, 4]
    short_pct: [3, 12]
    p_docs_ok: 0.95
    lead_time_days: 10
    p_change_accepted: 0.90
    p_change_partial: 0.05
    change_days: [3, 7]
    price_factor: 1.30
    freight_factor: 0.7
    lot_factor: 0.6
    order_channel: edi

  hybrid:                    # Wang A3: mittlerer Preis, 2 % Fehler, Fill Rate 98 %
    letter: C
    p_in_full: 0.98
    defect_rate: 0.02
    incoming_share: 0.6
    p_condition_ok: 0.88
    p_on_time: 0.96
    late_days: [1, 5]
    short_pct: [2, 8]
    p_docs_ok: 0.97
    lead_time_days: 21
    p_change_accepted: 0.60
    p_change_partial: 0.20
    change_days: [8, 15]
    price_factor: 1.00
    freight_factor: 1.0
    lot_factor: 1.0
    order_channel: edi

# ---------------------------------------------------------------------------
# Bauteile = Fälle aus config/cases.yaml.
#   wang_component   Gegenstück bei Wang (Kapazitäten von dort übernommen)
#   annual_demand    Jahresbedarf Bike Inc. für die nächste Periode
#   max_defect_rate  Wang Tabelle 4: maximal zulässige Fehlerquote
#   capacity_share   Jahreskapazität je Lieferant relativ zum Bedarf,
#                    = Kapazität / OEM-Bedarf bei Wang Tabelle 4
#   orders           Anzahl Bestellungen je Lieferant in der Historie
#                    (Vielfache von 10 bzw. 5, damit Fill Rate 80/90 % exakt
#                    getroffen wird; 98 % ist bei 20-25 Bestellungen nur als
#                    100 % oder 96 % darstellbar)
#   order_qty        Spanne der Losgröße (vor lot_factor)
components:
  ketten:
    name: Ketten
    wang_component: tires            # 400/700/600 bei Bedarf 1000
    annual_demand: 36000
    max_defect_rate: 0.02
    capacity_share: {lean: 0.40, agile: 0.70, hybrid: 0.60}
    orders: {lean: 15, agile: 30, hybrid: 25}
    order_qty: [300, 700]
    lot_round: 50
    base_price: 8.00
    base_freight: 120
    price_drift: 0.02
    claim_cost:                      # interne Bearbeitungskosten je Reklamation
      incoming_inspection: 45.0
      field_warranty: 38.0
      return: 30.0
    returns_share: 0.3               # Anteil Rückläufer an den Feldfehlern
    change_requests: {lean: 3, agile: 4, hybrid: 3}
    change_types: {volume_up: 0.6, volume_down: 0.4}
    change_pct: [10, 25]
    change_needed_within_days: 21
    rejection_reasons: {out_of_spec: 0.6, damaged: 0.4}

  batteriepacks:
    name: Batteriepacks
    wang_component: electronics      # 100/300/200 bei Bedarf 250
    annual_demand: 22000
    max_defect_rate: 0.02
    capacity_share: {lean: 0.40, agile: 1.20, hybrid: 0.80}
    orders: {lean: 10, agile: 20, hybrid: 20}
    order_qty: [150, 450]
    lot_round: 10
    base_price: 330.00
    base_freight: 220
    price_drift: 0.03
    claim_cost:
      incoming_inspection: 120.0
      field_warranty: 210.0          # Gefahrgut-Rücktransport, Diagnose
      return: 160.0
    returns_share: 0.3
    change_requests: {lean: 14, agile: 18, hybrid: 15}
    change_types: {variant_switch: 0.65, volume_up: 0.25, volume_down: 0.10}
    change_pct: [10, 30]
    change_needed_within_days: 14
    rejection_reasons: {out_of_spec: 0.45, damaged: 0.25, wrong_configuration: 0.30}

  konnektivitaetsmodule:
    name: Konnektivitätsmodule
    wang_component: peripherals      # 150/200/150 bei Bedarf 250
    annual_demand: 18000
    max_defect_rate: 0.02
    capacity_share: {lean: 0.60, agile: 0.80, hybrid: 0.60}
    orders: {lean: 10, agile: 30, hybrid: 25}
    order_qty: [80, 350]
    lot_round: 10
    base_price: 42.00
    base_freight: 60
    price_drift: 0.04
    claim_cost:
      incoming_inspection: 60.0
      field_warranty: 55.0
      return: 40.0
    returns_share: 0.3
    change_requests: {lean: 12, agile: 16, hybrid: 14}
    change_types: {volume_up: 0.45, revision_change: 0.35, volume_down: 0.20}
    change_pct: [15, 40]
    change_needed_within_days: 14
    rejection_reasons: {out_of_spec: 0.4, wrong_configuration: 0.5, damaged: 0.1}
